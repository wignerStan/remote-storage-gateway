[package]
name = "pingora-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Plugin-composed Pingora worker process and shared management entry"

[workspace]
resolver = "3"

[dependencies]
text-processing = { path = "../infra/rust/crates/text/processing", features = ["json"] }
stream-transfer = { path = "../infra/rust/crates/networking/stream/transfer" }
network-sockets = { path = "../infra/rust/crates/networking/sockets" }
action-router = { path = "../infra/rust/crates/networking/action-router" }
network-actions = { path = "../infra/rust/crates/networking/actions" }
plugin-lifecycle = { path = "../infra/rust/crates/plugins/lifecycle" }
plugin-loading = { path = "../infra/rust/crates/plugins/loading", features = ["async"] }
proxy-protocols = { path = "../infra/rust/crates/networking/proxy/protocols", default-features = false }
proxy-pingora = { path = "../infra/rust/crates/networking/proxy/pingora", features = ["native-proxy", "http-egress"] }
configuration = { path = "../infra/rust/crates/configuration" }
diagnostic-output = { path = "../infra/rust/crates/observability/diagnostic-output", features = ["runtime"] }
plugin-abi = { path = "../infra/rust/crates/interop/plugin-abi" }
pingora-proxy = { version = "=0.8.1", default-features = false, features = ["rustls"] }
pingora-error = "=0.8.1"
pingora-http = "=0.8.1"
url = "2"
bytes = "1"
http = "1"
async-trait = "0.1"
pingora-core = { version = "=0.8.1", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
test-support = { path = "../infra/rust/crates/testing/support" }
tokio = { version = "1", features = ["io-util"] }
tonic = { version = "0.14", features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
