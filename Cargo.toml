[package]
name = "network-data-plane-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Plugin-composed Pingora worker with axis entry routing and local control"

[workspace]
resolver = "3"

[features]
default = []
l4 = ["proxy-pingora/l4"]
l7 = ["proxy-pingora/l7", "proxy-pingora/native-proxy", "dep:event-stamp", "dep:admission-gate", "dep:llm-message-codec", "dep:text-processing", "dep:stream-transfer", "dep:network-sockets", "dep:action-router", "dep:action-execution", "dep:network-local-control", "dep:network-actions", "dep:plugin-registry", "dep:plugin-lifecycle", "dep:plugin-loading", "dep:proxy-protocols", "dep:configuration", "dep:diagnostic-output", "dep:plugin-abi", "dep:pingora-proxy", "dep:pingora-error", "dep:pingora-http", "dep:url", "dep:bytes", "dep:http", "dep:async-trait", "dep:pingora-core", "dep:futures-util", "dep:http-bridge", "dep:tracing"]
wasm = ["l7", "plugin-loading/wasm", "dep:wasm-sandbox"]

[dependencies]
event-stamp = { path = "../../infra/rust/crates/events/stamp", optional = true }
wasm-sandbox = { path = "../../infra/rust/crates/interop/wasm-sandbox", optional = true }
admission-gate = { path = "../../infra/rust/crates/processes/admission-gate", optional = true }
llm-message-codec = { path = "../../infra/rust/crates/ai/llm-message-codec", optional = true }
text-processing = { path = "../../infra/rust/crates/text/processing", features = ["json"], optional = true }
stream-transfer = { path = "../../infra/rust/crates/networking/stream/transfer", optional = true }
network-sockets = { path = "../../infra/rust/crates/networking/sockets", optional = true }
action-router = { path = "../../infra/rust/crates/networking/action-router", optional = true }
action-execution = { path = "../../infra/rust/crates/networking/action-execution", optional = true }
network-local-control = { path = "../../infra/rust/crates/networking/local-control", optional = true }
network-actions = { path = "../../infra/rust/crates/networking/actions", optional = true }
plugin-registry = { path = "../../infra/rust/crates/plugins/registry", optional = true }
plugin-lifecycle = { path = "../../infra/rust/crates/plugins/lifecycle", optional = true }
plugin-loading = { path = "../../infra/rust/crates/plugins/loading", features = ["async"], optional = true }
proxy-protocols = { path = "../../infra/rust/crates/networking/proxy/protocols", default-features = false, optional = true }
proxy-pingora = { path = "../../infra/rust/crates/networking/proxy/pingora", default-features = false }
configuration = { path = "../../infra/rust/crates/configuration", optional = true }
diagnostic-output = { path = "../../infra/rust/crates/observability/diagnostic-output", features = ["runtime"], optional = true }
plugin-abi = { path = "../../infra/rust/crates/interop/plugin-abi", optional = true }
pingora-proxy = { version = "=0.8.1", default-features = false, features = ["rustls"], optional = true }
pingora-error = { version = "=0.8.1", optional = true }
pingora-http = { version = "=0.8.1", optional = true }
url = { version = "2", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
pingora-core = { version = "=0.8.1", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
futures-util = { version = "0.3", optional = true }
http-bridge = { path = "../../infra/rust/crates/networking/http/bridge", optional = true }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "time", "io-util", "signal"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
h2 = "0.4"
wat = "1"
zstd = "0.13"
test-support = { path = "../../infra/rust/crates/testing/support" }
tokio = { version = "1", features = ["io-util"] }
tonic = { version = "0.14", features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"

[patch.crates-io]
pingora-proxy = { path = "../../infra/rust/.patched/pingora-proxy-0.8.1" }
