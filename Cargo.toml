[package]
name = "pingora-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Plugin-composed Pingora worker process and shared management entry"

[workspace]
resolver = "2"

[dependencies]
network-sockets = { path = "../infra/rust/crates/networking/sockets" }
action-router = { path = "../infra/rust/crates/networking/action-router" }
network-actions = { path = "../infra/rust/crates/networking/actions" }
plugin-lifecycle = { path = "../infra/rust/crates/plugins/lifecycle" }
plugin-loading = { path = "../infra/rust/crates/plugins/loading", features = ["async"] }
proxy-pingora = { path = "../infra/rust/crates/networking/proxy/pingora", features = ["native-ingress"] }
async-trait = "0.1"
pingora-core = { version = "=0.8.1", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
